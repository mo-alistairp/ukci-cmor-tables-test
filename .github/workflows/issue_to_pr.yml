name: Issue to PR

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-issue:
    if: >-
      contains(github.event.issue.labels.*.name, 'experiment_addition') ||
      contains(github.event.issue.labels.*.name, 'variable_addition')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate code
        run: python scripts/update_CVs.py 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch
        run: |
          BRANCH="issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists." | tee "$RUNNER_TEMP/update.log"
            exit 1
          fi
          git checkout -b "$BRANCH"
          git add tables/ cdds_ukci/variables.txt
          if git diff --cached --quiet; then
            echo "No changes were generated." | tee "$RUNNER_TEMP/update.log"
            exit 1
          fi
          git commit -m "Apply issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          git push origin "$BRANCH"

      - name: Create PR
        run: |
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "issue-${ISSUE_NUMBER}" \
            --title "$ISSUE_TITLE" \
            --body "Automatically generated from issue #${ISSUE_NUMBER}.

          Closes #${ISSUE_NUMBER}"

      - name: Report failure on issue
        if: failure()
        run: |
          {
            echo "Automatic PR generation failed:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/update.log" 2>/dev/null || echo "See the workflow run logs."
            echo '```'
            echo
            echo "Edit the issue, then close and reopen it to retry."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"